<!DOCTYPE html>
<html>
<head>
    <title>Student Hub - Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div style="width:90%; margin:auto; border:2px solid gray; padding:10px;">

    <!-- Header -->
    <table width="100%">
        <tr>
            <td width="10%">
                <img src="logo.png" alt="Logo" width="100" height="70">
            </td>

            <td>
                <h1 style="margin:0;">Student Hub</h1>
            </td>
            
             <td align="right" width="15%">
            <a href="home.html"><button>LOGOUT</button></a></td>
        </td>
        </tr>
    </table>

    <hr>

    <!-- Feedback Title -->
    <center>
        <h2>Feedback</h2>
        <p>We value your feedback! Please share your experience.</p>
    </center>

    <!-- Feedback Form -->
    <form>

        <table border="1" width="100%" cellpadding="10">

            <tr>
                <td>
                    Name <br><br>
                    <input type="text" size="60">
                </td>
            </tr>

            <tr>
                <td>
                    Email <br><br>
                    <input type="email" size="60">
                </td>
            </tr>

        </table>

        <br>

        <center>

            <b>Rating :</b>

            <br><br>

            ★ ★ ★ ★ ★

        </center>

        <br><br>

        Feedback <br><br>

        <textarea rows="6" cols="80"></textarea>

        <br><br>

        <center>
    <td>
         <a href="logout.html">
        <button type="button">Submit</button>
        </a>
    </td>

            &nbsp;&nbsp;&nbsp;&nbsp;

            <button type="reset">Clear</button>

        </center>

    </form>

</div>

</body>
</html>
