<!DOCTYPE html>
<html>
<head>
    <title>Student Hub - Contact</title>
</head>

<body>

<div style="width:90%; margin:auto; border:2px solid gray; padding:10px;">

    <!-- Header -->
    <table width="100%">
        <tr>
            <td width="10%">
                <img src="logo.png" alt="Logo" width="100" height="70">
            </td>

            <td>
                <h1 style="margin:0;">Student Hub</h1>
            </td>
        </tr>
    </table>

    <hr>

    <!-- Navigation Bar -->
    <table width="100%">
        <tr align="center">
            <td><a href="home.html"><button>HOME</button></a></td>
            <td><a href="contact.html"><button>CONTACT</button></a></td>
            <td><a href="profile.html"><button>PROFILE</button></a></td>
            <td><a href="dashboard.html"><button>DASHBOARD</button></a></td>
            <td><a href="events.html"><button>EVENTS</button></a></td>
            <td><a href="about.html"><button>ABOUT</button></a></td>
            <td><a href="feedback.html"><button>FEEDBACK</button></a></td>
        </tr>
    </table>

    <hr>

    <!-- Welcome -->
    <h3>Welcome!</h3>

    <table width="100%">
        <tr>

            <!-- Left Side -->
            <td width="35%" valign="top">

                <button style="width:220px;">College Address</button>

                <br><br>

                <button style="width:220px;">College Contact No.</button>

                <br><br>

                <button style="width:220px;">College Email</button>

            </td>

            <!-- Vertical Line -->
            <td width="5%">
                <hr style="height:250px; width:1px;">
            </td>

            <!-- Right Side -->
            <td width="60%" valign="top">

                <form>

                    <input type="text" placeholder="Name" size="40">

                    <br><br>

                    <input type="email" placeholder="Email" size="40">

                    <br><br>

                    <input type="text" placeholder="Mobile No." size="40">

                    <br><br>

                    <textarea placeholder="Message" rows="5" cols="42"></textarea>

                    <br><br>

                    <button type="submit">Submit</button>

                </form>

            </td>

        </tr>
    </table>

</div>

</body>
</html>
