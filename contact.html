</head>

<body>

<div class="container">
<div class="contact-card">
<!-- Header -->
<table width="100%">
    <tr>

        <td width="10%">
            <img src="logo.png" alt="Logo" width="100" height="70">
        </td>

        <td>
            <h1 class="page-logo">Student Hub</h1>
        </td>

        <td align="right" width="15%">
            <a href="logout.html">
                <button>LOGOUT</button>
            </a>
        </td>

    </tr>
</table>

<hr>

    <!-- Navigation Bar -->
    <table width="100%">
        <tr align="center">
            <td><a href="home.html"><button>HOME</button></a></td>
            <td><a href="contact.html"><button>CONTACT</button></a></td>
            <td><a href="profile.html"><button>PROFILE</button></a></td>
            <td><a href="dashboard.html"><button>DASHBOARD</button></a></td>
            <td><a href="events.html"><button>EVENTS</button></a></td>
            <td><a href="about.html"><button>ABOUT</button></a></td>
            <td><a href="feedback.html"><button>FEEDBACK</button></a></td>
        </tr>
    </table>

    <hr>

    <!-- Welcome -->
   <h2>Contact Us</h2>

<p class="contact-subtitle">
We'd love to hear from you. Feel free to send us your questions or feedback.
</p>

    <div class="contact-content">

    <!-- Left Side -->

    <div class="contact-info">

        <div class="info-box">
            <h3>📍 College Address</h3>
            <p>
                ABC Engineering College<br>
                Ahmedabad, Gujarat
            </p>
        </div>

        <div class="info-box">
            <h3>📞 Contact Number</h3>
            <p>+91 98765 43210</p>
        </div>

        <div class="info-box">
            <h3>📧 Email</h3>
            <p>studenthub@gmail.com</p>
        </div>

    </div>

    <!-- Right Side -->

    <div class="contact-form">

        <form>

            <input type="text" placeholder="Your Name">

            <input type="email" placeholder="Your Email">

            <input type="text" placeholder="Mobile Number">

            <textarea rows="6" placeholder="Write your message"></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

</div>

   </div>
   </div>
