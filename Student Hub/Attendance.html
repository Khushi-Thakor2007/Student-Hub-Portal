<!DOCTYPE html>
<html>
<head>

    <title>Student Hub - Attendance</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Poppins:wght@400;600;700&family=Homemade+Apple&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>
<button id="themeToggle" class="theme-toggle">🌙</button>
<div class="container">

    <!-- HEADER -->
    <table width="100%">
        <tr>

            <td width="10%">
                <img src="logo.png" alt="Logo" width="100" height="70">
            </td>

            <td>
                <h1 class="page-logo">Student Hub</h1>
            </td>

            <td align="right" width="15%">
                <a href="logout.html">
                    <button>LOGOUT</button>
                </a>
            </td>

        </tr>
    </table>

    <hr>

    <!-- PAGE TITLE -->
    <div class="attendance-page">

        <h2 class="academic-title">Academic Information</h2>

        <p class="academic-subtitle">
            Access your notifications, attendance, calendar and study materials.
        </p>

        <!-- MAIN ACADEMIC LAYOUT -->
        <table class="academic-layout" width="100%">
            <tr>

                <!-- LEFT MENU -->
                <td class="academic-menu">

                    <a href="notification.html">
                        <button>Notification</button>
                    </a>

                    <a href="calendar.html">
                        <button>Calendar</button>
                    </a>

                    <a href="attendance.html">
                        <button class="academic-active">Attendance</button>
                    </a>

                    <a href="material.html">
                        <button>Material</button>
                    </a>

                    <a href="sgpa.html">
                        <button>SGPA/CGPA</button>
                    </a>

                </td>

                <!-- VERTICAL LINE -->
                <td class="academic-divider-cell">
                    <div class="academic-divider"></div>
                </td>

                <!-- ATTENDANCE CONTENT -->
                <td class="attendance-section">

                    <div class="attendance-content-card">

                        <h2>Attendance</h2>

                        <div class="attendance-main">

                            <div class="attendance-circle">

                                <span>80%</span>

                            </div>

                            <div class="attendance-details">

                                <h3>Current Attendance</h3>

                                <p>
                                    Your attendance is <b>80%</b>.
                                </p>

                                <p>
                                    Minimum required attendance is <b>80%</b>.
                                </p>

                                <p>
                                    Keep attending classes regularly to maintain eligibility.
                                </p>

                            </div>

                        </div>

                    </div>

                </td>

            </tr>
        </table>

    </div>

</div>
<script src="script.js"></script>
</body>
</html>
