<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    <div class="login-container">
        <div class="left-side">
            <img src="loginimage.jpg"  alt="Student Hub Background"  class="background-image">
            <div class="overlay"></div>

            <div class="welcome-text">
                <h2>
                    Welcome<br>
                    Back,
                </h2>
            </div>

            <div class="brand">

                <div class="brand-icon">  ◢  </div>

                <h1>
                    Student Hub
                </h1>

            </div>

            <p class="welcome-description">
                Enter your personal details and start<br>
                your journey with us
            </p>

        </div>

        <div class="right-side">
            <div class="blur-background"></div>
            <div class="login-content">
                <h2 class="login-title">
                    Login
                </h2>
                <p class="subtitle">
                    Access your Student Hub account.
                </p>
                <button type="button" class="google-button">
                    <span class="google-icon"> G </span>
                    Sign in with Google
                </button>

                <button type="button" class="email-button">
                    <span>Sign in with Email</span>
                </button>

                <hr>

                <form onsubmit="loginUser(); return false;">
                    <label for="email"> Email </label>
                    <input type="email" id="email"  placeholder="mail@website.com" >
                    <label for="password">  Password  </label>
                    <input type="password" id="password" placeholder="Min. 8 character" >
                    <div class="options">
                        <label class="remember">
                            <input type="checkbox">
                            <span>  Remember me  </span>
                        </label>
                        <a href="#"> Forgot password? </a>
                    </div>
                    <button type="submit" class="login-button"> Login </button>
                </form>

                <p class="register">
                    Not registered yet?
                    <a href="Register.html">  Create an Account </a>
                </p>
            </div>
        </div>
    </div>
    <script src="script.js"></script> 
</body>
</html>
