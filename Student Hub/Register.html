<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Hub - Register</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    </head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        <div class="container">
            <div class="header">
                <div class="logo-title">
                <img src="logo.png" alt="Logo">
                <h1>Student Hub</h1>
            </div>
            <a href="login.html" class="register-btn">  Login    </a>
        </div>
    <hr>
    <div class="register-card">
        <h2>Create an Account</h2>

    <form class="register-form" onsubmit="registeruser();return false;">
        <input type="text" id="name" placeholder="Full Name">
        <input type="text" id="studentId" placeholder="Student ID">
        <input type="email" id="email" placeholder="Email Address">
        <input type="text" id="mobile" placeholder="Mobile Number">
        <input type="password" id="registerPassword" placeholder="Password">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
        <label class="terms">
        <input type="checkbox" id="terms">
            I agree to the Terms & Conditions
        </label>
            <button type="submit">Register</button>
            <p class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>    
    </form>

            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
