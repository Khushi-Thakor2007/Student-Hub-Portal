<!DOCTYPE html>
<html>
 <head>
 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub - Register</title>
     <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Header -->
   <div class="header">

    <div class="logo-title">
        <img src="logo.png" alt="Logo">
        <h1>Student Hub</h1>
    </div>

    <a href="login.html" class="register-btn">
        Login
    </a>

</div>

<hr>
    <hr>

    <!-- Registration Form -->
    <div class="register-card">

<h2>Create an Account</h2>

<form class="register-form">

<input type="text" placeholder="Full Name">

<input type="text" placeholder="Student ID">

<input type="email" placeholder="Email Address">

<input type="text" placeholder="Mobile Number">

<input type="password" placeholder="Password">

<input type="password" placeholder="Confirm Password">

<label class="terms">

<input type="checkbox">

I agree to the Terms & Conditions

</label>

<button type="submit">
Register
</button>

<p class="login-link">
Already have an account?
<a href="login.html">Login</a>
</p>

</form>

</div>

</div>

</body>
</html>
