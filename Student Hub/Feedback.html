<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub - Feedback</title>
     <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<button id="themeToggle" class="theme-toggle">🌙</button>
<div class="container">

    <!-- Header -->
    <table width="100%">
        <tr>
            <td width="10%">
                <img src="logo.png" alt="Logo" width="100" height="70">
            </td>

            <td>
               <h1 class="page-logo">Student Hub</h1>
            </td>
            
             <td align="right" width="15%">
            <a href="home.html"><button>LOGOUT</button></a></td>
        </td>
        </tr>
    </table>

    <hr>

    <!-- Feedback Title -->
  <div class="feedback-card">

<h2>Feedback</h2>

<p class="feedback-subtitle">
We value your feedback! Please share your experience.
</p>

    <!-- Feedback Form -->
    <form>

        <table border="1" width="100%" cellpadding="10">

            <tr>
                <td>
                    Name <br><br>
                    <input type="text" size="60">
                </td>
            </tr>

            <tr>
                <td>
                    Email <br><br>
                    <input type="email" size="60">
                </td>
            </tr>

        </table>

     </table>

     <div class="rating">

    <b>Rating</b>

    <div class="star-rating">

        <input type="radio" id="star5" name="rating" value="5">
        <label for="star5">★</label>

        <input type="radio" id="star4" name="rating" value="4">
        <label for="star4">★</label>

        <input type="radio" id="star3" name="rating" value="3">
        <label for="star3">★</label>

        <input type="radio" id="star2" name="rating" value="2">
        <label for="star2">★</label>

        <input type="radio" id="star1" name="rating" value="1">
        <label for="star1">★</label>

    </div>

</div>

<label>Feedback</label>

<textarea rows="6"></textarea>

        <br><br>

        <div class="feedback-buttons">

<button type="submit">Submit</button>

<button type="reset">Clear</button>

</div>

    </form>
    </div>

</div>
<script src="script.js"></script>
</body>
</html>
