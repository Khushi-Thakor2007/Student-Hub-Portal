<!DOCTYPE html>
<html>
<head>
    <title>Student Hub - Login</title>
</head>

<body>

<div style="width:90%; margin:auto; border:1px solid gray; padding:15px;">

    <table width="100%">
        <tr>

            <!-- Left Side -->
            <td width="50%" valign="top">

                <a href="home.html">← Back</a>

                <br><br>

                <div style="width:100%; height:500px; background-color:#d9d9d9;
                            display:flex; justify-content:center;
                            align-items:center; font-size:40px;">

                    <b>IMAGE</b>

                </div>

            </td>

            <!-- Right Side -->
            <td width="50%" valign="top" style="padding-left:20px;">

                <!-- Logo and Title -->
                <table width="100%">
                    <tr>
                        <td width="20%">
                            <img src="logo.png" alt="Logo" width="100" height="70">
                        </td>

                        <td>
                            <h1 style="margin:0;">Student Hub</h1>
                        </td>
                    </tr>
                </table>

                <hr>

                <h2>Login</h2>

                <p>Access your Student Hub Account</p>

                <!-- Google Button -->
                <button style="width:100%; height:35px;">
                    Sign In With Google
                </button>

                <hr>

                <center>OR Sign In With Email</center>

                <br>

                <!-- Email -->
                <label>Email</label><br>
                <input type="email" style="width:100%; height:30px;">

                <br><br>

                <!-- Password -->
                <label>Password</label><br>
                <input type="password" style="width:100%; height:30px;">

                <br><br>

                <table width="100%">
                    <tr>
                        <td>
                            <input type="checkbox"> Remember Me
                        </td>

                        <td align="right">
                            <a href="#">Forgot Password?</a>
                        </td>
                    </tr>
                </table>

                <br>

                <button style="width:100%; height:35px;">
                    Login
                </button>

                <br><br>

                <center>
                    Not Registered Yet?
                    <a href="#">Create an Account</a>
                </center>

            </td>

        </tr>
    </table>

</div>

</body>
</html>
